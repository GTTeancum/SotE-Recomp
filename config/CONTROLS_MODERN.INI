; Shadows of the Empire Recompiled - Modern Controls tuning.
; This file is hot-reloaded while the game is running. Values here
; affect only the port's Modern control helpers; the in-game Controls
; menu still chooses Classic or Modern per control category.
; Lines beginning with ';' or '#' are comments.

[General]
; movement_deadzone is 0.0 to 1.0. 0.0 means no left-stick deadzone;
; 1.0 means the left stick is fully ignored. Higher values prevent
; drift but require more stick travel before Dash or the bike moves.
movement_deadzone = 0.244141

; movement_sensitivity is 0.1 to 3.0. 1.0 is normal. Lower values
; reduce left-stick output after the deadzone. Higher values reach
; full N64 stick sooner and can make movement/steering more abrupt.
movement_sensitivity = 1

; aim_deadzone is 0.0 to 1.0. 0.0 means no right-stick deadzone;
; 1.0 means the right stick never sends C-button/camera input.
; Increase this if the camera or aiming drifts when the stick rests.
aim_deadzone = 0.366211

; aim_sensitivity is 0.1 to 3.0. 1.0 is normal. Because the N64 C
; buttons are digital, this changes how easily right-stick motion
; crosses the C-button activation point rather than true analog speed.
aim_sensitivity = 1

; trigger_deadzone is 0.0 to 1.0. 0.0 means LT/RT react instantly;
; 1.0 means triggers are ignored. Higher values help worn triggers
; stop firing, aiming, accelerating, or braking by accident.
trigger_deadzone = 0.244148

; trigger_sensitivity is 0.1 to 3.0. 1.0 is normal. Lower values
; require a deeper pull after the deadzone; higher values reach full
; trigger strength sooner. Bike throttle/brake duty-cycle uses this.
trigger_sensitivity = 1

[LookSnapBack]
; look_snap_back_enabled is 0 or 1. 0 disables it. 1 taps a C-button
; after the right stick returns to center. This is experimental and
; defaults off because the original game did not have a modern stick.
look_snap_back_enabled = 0

; look_snap_back_delay_seconds is 0.0 to 5.0. It is how long the
; right stick must stay centered before the snap-back tap starts.
; Lower values recenter sooner; higher values wait longer.
look_snap_back_delay_seconds = 0.35

; look_snap_back_duration_seconds is 0.0 to 1.0. It is how long the
; snap-back C-button is held. Too short may do nothing; too long can
; feel like an extra camera command after aiming.
look_snap_back_duration_seconds = 0.08

; look_snap_back_button accepts C_UP, C_DOWN, C_LEFT, or C_RIGHT.
; C_UP is the default candidate for looking forward/recentering.
look_snap_back_button = C_UP

[SpeederBike]
; bike_fire_button accepts A, B, Z, L, or R. It is only used if the
; bike sequence ever needs a separate Modern fire mapping. The current
; Modern bike path leaves Fire/Kick unbound because the game did not
; use them in the bike stage.
bike_fire_button = A

; bike_steering_curve_exponent is 0.25 to 4.0. 1.0 is linear.
; Higher values soften small steering corrections near center while
; keeping full lock at the edge. Lower values make steering twitchier.
bike_steering_curve_exponent = 1.6

; bike_high_speed_sensitivity_falloff is 0.0 to 1.0. 0.0 keeps bike
; steering equally strong at all speeds. Higher values reduce steering
; as RT throttle increases, making full-speed steering calmer.
bike_high_speed_sensitivity_falloff = 0.45

; bike_high_speed_min_scale is 0.0 to 1.0. It is the floor for the
; high-speed steering reduction above. Lower values allow weaker
; steering at full throttle; higher values preserve more authority.
bike_high_speed_min_scale = 0.35

; bike_steering_stabilization is 0.0 to 0.99. 0.0 applies steering
; instantly. Higher values smooth steering changes over more polls,
; reducing jitter at the cost of extra steering latency.
bike_steering_stabilization = 0.18

; bike_camera_smoothing is 0.0 to 0.99. 0.0 applies the trigger-based
; throttle/brake stick axis instantly. Higher values smooth those
; changes so the bike camera/throttle axis is less abrupt.
bike_camera_smoothing = 0.25
