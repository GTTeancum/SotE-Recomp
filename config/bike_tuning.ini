; Speeder-bike Modern control scheme tuning.
; Only read while Control Scheme = Modern (set in-game via the injected
; Options > Controls tab). Hot-reloaded: the game polls this file's
; mtime and reloads on change, no restart needed.
;
; fire_button: which physical N64 button Modern's RB maps to.
; UNVERIFIED against the original bike sequence's actual "fire" input --
; defaults to A. If the bike doesn't fire under Modern, or fires while
; also doing something else unwanted, try B or Z here first.
; Valid values: A, B, Z, L, R
fire_button = A

; Steering response curve: output = sign(input) * |input|^exponent.
; 1.0 = linear passthrough. >1.0 softens small deflections and sharpens
; near full deflection (progressive feel). <1.0 does the opposite.
steering_curve_exponent = 1.6

; At full throttle, steering sensitivity is scaled down toward
; high_speed_min_scale: scale = max(min_scale, 1 - throttle * falloff).
; Set high_speed_sensitivity_falloff to 0.0, or high_speed_min_scale to
; 1.0, to disable the falloff entirely.
high_speed_sensitivity_falloff = 0.45
high_speed_min_scale = 0.35

; Low-pass damping on the steering output, 0..1. 0 = no stabilization
; (raw curve output every frame). Higher = smoother but laggier turn-in.
steering_stabilization = 0.18

; Low-pass damping on the throttle/brake axis that also feeds the
; camera-relevant forward value, 0..1. This is a proxy for "smoother
; camera behavior" -- there's no direct camera hook here, just a
; smoothed version of the same trigger-derived value the bike controller
; reads for speed. Raise this if the camera still feels jerky under
; rapid trigger changes; lower it if throttle response feels sluggish.
camera_smoothing = 0.25
